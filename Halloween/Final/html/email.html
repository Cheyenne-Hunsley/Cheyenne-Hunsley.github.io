<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../styles/normalize.css" type="text/css">
	<link rel="stylesheet" href="../styles/email.css" type="text/css">
	<title>Halloween Store</title>
</head>

<body>
	<header>
		<img src="../images/pumpkin.gif"	alt="pumpkin gif">
		<div>
		<h1>The Halloween Store</h1>
		<h3>For the little Goblin in all of us!</h3>
		</div>
		<nav>
			<ul>
				<li><a href="../html/index.html">Home</a></li>
				<li><a href="../html/product.html">Product List</a></li>
				<li><a href="../html/personal.html">Personal</a></li>
				<li><a href="../html/decorating.html">Decorating Ideas</a></li>
				<li><a href="../html/email.html" class="active">Join Email</a></li>
			</ul>
		</nav>
	</header>
    <main>
        <section id="aside">
			<ul type="none">
				<li><a href="../html/props.html">Props</a></li>
				<li><a href="../html/costumes.html">Costumes</a></li>
				<li><a href="../html/special.html">Special FX</a></li>
				<li><a href="../html/masks.html">Masks</a></li>
			</ul>
		</section>
        <section id="email">
            <form action="../html/subscribe.html" method="get" >
                <fieldset>
                    <legend>Please enter the following information:</legend>
						<div class="formRow">
							<label for="fName">First Name:</label>
							<input type="text" id="fName" name="fName" required>
						</div>
						<div class="formRow">
							<label for="lName">Last Name:</label>
							<input type="text" id="lName" name="lName" required>
						</div>
						<div class="formRow">
							<label for="email">Email:</label>
							<input type="email" id="email" name="email" required>
						</div>
						<div class="formRow">
							<label for="zipcode">Zipcode:</label>
							<input type="text" id="zipcode" name="zipcode" placeholder="Optional but appreciate: 99999" pattern="[0-9]{5}">
						</div>
                    <button type="submit" id="subButton">Subscribe</button>
                </fieldset>
            </form>
        </section>
    </main>
    <footer>
		<p>&copy; 2018 Ben Murach</p>
	</footer>
</body>
</html>
