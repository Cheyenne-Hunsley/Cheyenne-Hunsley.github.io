        <main>
            <form action="process.php" method="get" name="FormName">
                <fieldset>
                        <legend>Personal Info:</legend>
                    <label for="fName">First Name:</label>
                    <input type="text" id="fName" value="John">
                    <label for="lName">Last Name:</label>
                    <input type="text" id="lName" value="Smith">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
                </fieldset>

                <input type="radio" name="gender" id="female" value="Female">
                <label for="female">Female</label><br>
                <input type="radio" name="gender" id="male" value="Male">
                <label for="male">Male</label><br>
                <input type="radio" name="gender" id="other" value="Other">
                <label for="other">Other</label><br><br><br>

                <p>choose your commute way:</p>
                <input type="checkbox" name="commute" id="car" name="commute" value="Car">
                <label for="car">Car</label><br>
                <input type="checkbox" name="commute" id="train" name="commute" value="Train">
                <label for="train">Train</label><br>
                <input type="checkbox" name="commute" id="bike" name="commute" value="Bike">
                <label for="bike">Bike</label><br><br><br>

                <label for="browsers">Your Browsers:</label>
                <select name="browsers" id="browsers">
                    <optgroup label="Mac">
                        <option value="chrome">Google Chrome</option>
                        <option value="firefox">Mozilla Firefox</option>
                        <option value="Safari">Safari</option>
                    </optgroup>
                    <optgroup label="Windows">
                        <option value="IE">Internet Explorer</option>
                        <option value="edge">Microsoft Edge</option>
                        <option value="opera">Opera</option>
                    </optgroup>
                </select><br><br><br>
                <p>Chose your favorite Car:</p>
                <input list="cars">
                <datalist id="cars">
                    <option value="Fiat"></option>
                    <option value="Ford"></option>
                    <option value="Toyota"></option>
                    <option value="Mazda"></option>
                </datalist><br><br><br>
                <label for="comment">Comment:</label>
                <textarea name="comment" id="comment" rows="10" cols="30">Provide Your Comment Here</textarea><br><br><br>
                <input type="submit" value="Submit">
                <button type="button" onclick="alert('Hello There!')">Click Here!</button>
            </form>
