<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./styles/normalize.css" rel="stylesheet" type="text/css">
    <link href="./styles/login.css" rel="stylesheet" type="text/css">
    <title>Login/Sign Up</title>
</head>
<body>
    <header>
        <img src="./images/logo.png" alt="logo"  id="logo">
        <h1>Bookaneers</h1>
        <button type="button">Login/Sign Up</button>
        <img src="./images/profileicon.png"  alt="profile picture" id="profileicon">
        <nav>
            <ul>
                <li><a href="homepage.html">Homepage</a></li>
                <li><a href="fiction.html">Fiction</a></li>
                <li><a href="nonfiction.html">Non-Fiction</a></li>
                <li><a href="aboutus.html">About Us</a></li>
            </ul>
        </nav>

    </header>
    <main>
        <section id="Login">
            <h2>Log In</h2>
            <form>
                <label>Username:</label>
                <input type="text" id="Username" class="input">
                <label>Password</label>
                <input type="text" id="Password" class="input">
            </form>
        </section>
        <section id="SignUp">
            <h2>Sign Up</h2>
            <form>
                <label>Email:</label>
                <input type="email" id="Email" placeholder="user@email.com" class="input">
                <label>Username:</label>
                <input type="text" id="Username" class="input">
                <label>Password</label>
                <input type="text" id="Password" class="input">
                <p>must contain</p>
                <ul>
                    <li>at least 8 Characters</li>
                    <li>Upper and Lower case</li>
                    <li>at least 1 Special Character</li>
                </ul>
            </form>
        </section>
    </main>
</body>
<footer>
    <p>Contact Us</p>
    <p>customerservice@bookaneers.com</p>
    <p>205 Humber College Boulevard, Toronto, ON, M9W 5L7</p>
    <p>416-555-BOOK</p>
</footer>
</html>
